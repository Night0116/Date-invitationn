<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Онцгой урилга — миний зүрхнээс бичсэн үг: 'Надтай болзох уу?'" />
  <title>Надтай болзох уу? ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#07060a;--card:rgba(22,18,38,0.8);--glass:rgba(255,255,255,0.12);--p:#ff2a5f;--accent:#ec4899;--muted:#94a3b8}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{background:linear-gradient(180deg,#04040a 0%,#090716 100%);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
    main{width:100%;max-width:880px}
    .card{background:var(--card);border:1px solid var(--glass);border-radius:18px;padding:36px;box-shadow:0 30px 60px rgba(0,0,0,0.6);position:relative;overflow:hidden}
    .hero{display:flex;gap:24px;align-items:center}
    .hero-left{flex:1}
    .hero-title{font-family:'Playfair Display',serif;font-size:42px;line-height:1.02;margin-bottom:12px;background:linear-gradient(90deg,#fff,#e6eef8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hero-sub{color:var(--muted);font-size:16px;margin-bottom:18px}
    .hero-actions{display:flex;gap:12px}
    .btn{padding:12px 20px;border-radius:999px;border:none;cursor:pointer;font-weight:700}
    .btn-primary{background:linear-gradient(90deg,var(--p),var(--accent));color:#fff;box-shadow:0 8px 28px rgba(255,42,95,0.18)}
    .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
    .hero-right{width:220px;display:flex;flex-direction:column;align-items:center}
    .portrait{width:160px;height:160px;border-radius:16px;background:linear-gradient(135deg,var(--p),var(--accent));display:flex;align-items:center;justify-content:center;font-size:48px}
    .invitation-lines{margin-top:18px;max-height:420px;overflow:auto;padding-right:6px}
    .line{font-size:14px;color:var(--muted);margin-bottom:6px}
    .line.strong{color:#fff;font-weight:700}
    .confetti-note{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
    .hide-mobile{display:block}
    @media(max-width:720px){.hero{flex-direction:column}.hero-right{width:100%}.portrait{width:120px;height:120px}.invitation-lines{max-height:260px}.hide-mobile{display:none}}
    /* subtle decorative background */
    .bg-orbs{position:absolute;inset:0;pointer-events:none;z-index:0}
    .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.36}
    .orb.one{width:420px;height:420px;background:#ff2a5f;top:-10%;left:-5%}
    .orb.two{width:520px;height:520px;background:#8b5cf6;right:-15%;bottom:-10%}
    .orb.three{width:320px;height:320px;background:#ec4899;left:40%;top:35%}
  </style>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
  </div>
  <main>
    <div class="card" role="main" aria-labelledby="invite-title">
      <div class="hero">
        <div class="hero-left">
          <h1 id="invite-title" class="hero-title">Надтай болзох уу?</h1>
          <p class="hero-sub">Энэхүү үгсийг би үнэн сэтгэлээсээ бичиж байна. Өнөөдрийн энэ цагаар зөвхөн чи, би, ба миний хэлэх энгийн мөрүүд — бидний дурсамж эхлэх юм.</p>
          <div class="hero-actions">
            <button class="btn btn-primary" id="accept-btn">Тийм — Би явна 💖</button>
            <button class="btn btn-ghost" id="maybe-btn">Бага зэрэг үнэлэх үү…</button>
          </div>
          <p class="confetti-note">(Хэрвээ "Тийм" гэж дарвал бага зэрэг баяр тэмдэглэх конфетти гарах болно.)</p>
        </div>
        <div class="hero-right">
          <div class="portrait" aria-hidden="true">✨</div>
          <div class="hide-mobile" style="margin-top:12px;color:var(--muted);font-size:13px;text-align:center">Энэ бол миний урилга — энгийн мөрүүд биш, зүрхэнд хүрэх хүсэл.</div>
        </div>
      </div>

      <!-- Long invitation content is generated by JS to keep the file size reasonable but render 1500+ visible lines -->
      <div id="invitation-container" class="invitation-lines" aria-live="polite" tabindex="0"></div>

      <script>
        // Create an evocative Mongolian invitation and then generate many short lines
        (function(){
          const container = document.getElementById('invitation-container');

          // Central long-letter that replaces the old counter and opens the heart
          const opening = `
          Намайг сонсооч — энэ бол зүрхний энгийн нэг хүсэл юм. 
          Таны инээмсэглэл миний өдрийг гэрэлтүүлдэг, 
          таны яриа миний хамгийн дуртай аялгуу, 
          танд зориулсан энэ урилга бол миний сэрэх болгонд би тантай хуваалцахыг хүссэн жижиг мөрүүд нь юм.
          `;

          const openingEl = document.createElement('p');
          openingEl.className = 'line strong';
          openingEl.textContent = opening.trim();
          container.appendChild(openingEl);

          // base fragments to compose hundreds of short heartfelt lines
          const starts = [
            'Чиний инээмсэглэл нь', 'Чамайг санахад', 'Бид хоёрын дунд', 'Миний бодолд', 'Таны гарыг барихад',
            'Өвлийн шөнө шиг', 'Нар мандахтай адил', 'Энэ сэтгэл', 'Жаргал шиг', 'Хором бүр'
          ];
          const middles = [
            'миний зүрх дүнхэнүүлнэ', 'нарны гэрэл мэт дулаахан', 'эхлэл шинэлэг мэт', 'анхны цэцэг шиг шинэ', 'мартагдашгүй нэгэн дурсамж'
          ];
          const ends = [
            'бишрэмжээр дүүрэн.', 'нам гүм, зориулалттай.', 'зөндөө сайхан ухааруулна.', 'үнэхээр үнэ цэнэтэй.', 'хэзээ ч мартагдахгүй.'
          ];

          // produce 1600 lines by combining fragments with small variations
          const target = 1600;
          for (let i = 0; i < target; i++){
            const s = starts[i % starts.length];
            const m = middles[(i + 3) % middles.length];
            const e = ends[(i + 5) % ends.length];
            const line = `${s} ${m} ${e}`;
            const p = document.createElement('p');
            p.className = 'line';
            p.textContent = line;
            // Slightly emphasize occasional lines to create rhythm
            if (i % 37 === 0) p.classList.add('strong');
            container.appendChild(p);
          }

          // small graceful auto-scroll to show that the page is long and heartfelt
          container.scrollTop = 0;

          // Button interactions
          const accept = document.getElementById('accept-btn');
          accept.addEventListener('click', () => {
            // simple visual confirmation + confetti
            launchConfetti();
            accept.disabled = true;
            accept.textContent = 'Би баяртайяа! 💖';
          });

          const maybe = document.getElementById('maybe-btn');
          maybe.addEventListener('click', () => {
            // reveal a short gentle nudge
            alert('Хэрвээ та эргэлзэж байвал — зөвхөн нэг цай уугаад ярилцаарай. Би тэсвэртэй.');
          });

          // Confetti (lightweight) -------------------------------------------------
          function launchConfetti(){
            // create small confetti elements in DOM for accessibility and performance
            const confettiRoot = document.createElement('div');
            confettiRoot.style.position = 'fixed';
            confettiRoot.style.inset = '0';
            confettiRoot.style.pointerEvents = 'none';
            confettiRoot.style.zIndex = '9999';
            document.body.appendChild(confettiRoot);

            const colors = ['#ff2a5f','#ec4899','#8b5cf6','#3b82f6','#10b981','#f59e0b'];
            const count = 60;
            for (let i=0;i<count;i++){
              const el = document.createElement('div');
              el.style.position='absolute';
              el.style.width='10px';
              el.style.height='14px';
              el.style.background=colors[i%colors.length];
              el.style.left = Math.random()*100 + '%';
              el.style.top = '-10%';
              el.style.transform = 'rotate(' + (Math.random()*360)+'deg)';
              el.style.opacity = '0.95';
              el.style.borderRadius = '2px';
              confettiRoot.appendChild(el);
              // animate via requestAnimationFrame for simple physics
              (function animateConfetti(node, vx){
                let y = -50; let x = parseFloat(node.style.left);
                let vy = 2 + Math.random()*4; let vxLocal = (Math.random()-0.5)*6;
                function step(){
                  y += vy; x += vxLocal; vy += 0.12; node.style.top = (y/ (window.innerHeight/100)) + '%'; node.style.left = x + '%';
                  node.style.opacity = Math.max(0, 1 - y/ (window.innerHeight));
                  if (y < window.innerHeight + 100) requestAnimationFrame(step); else node.remove();
                }
                requestAnimationFrame(step);
              })(el, (Math.random()-0.5)*6);
            }
            // cleanup after 6s
            setTimeout(()=>{ if(confettiRoot) confettiRoot.remove(); }, 6000);
          }

        })();
      </script>

    </div>
  </main>
</body>
</html>
